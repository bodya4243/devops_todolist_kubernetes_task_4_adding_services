apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: my-namespace
  labels:
    app: todolist
spec:
  containers:
  - name: todoapp
    image: bodya4243/todoapp:1.0.1
    imagePullPolicy: Always
    env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: SECRET_KEY
      value: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    - name: DEBUG
      value: "True"
    - name: DATABASE_ENGINE
      value: "django.db.backends.sqlite3"
    - name: DATABASE_NAME
      value: "/app/db.sqlite3"
    ports:
    - containerPort: 8080
    livenessProbe:
      httpGet:
        path: api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5

